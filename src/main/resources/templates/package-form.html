<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${pkg.id != null} ? 'Edit Package' : 'Create Package'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .image-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .image-preview img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center text-primary mb-4" th:text="${pkg.id != null} ? 'Edit Package' : 'Create New Package'"></h2>

        <!-- ⚡ Important: multipart/form-data for file upload -->
        <form th:action="${pkg.id != null} ? @{'/admin/packages/update/' + ${pkg.id}} : @{/admin/packages/create}"
              th:object="${pkg}" method="post" enctype="multipart/form-data">

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Title</label>
                    <input type="text" class="form-control" th:field="*{title}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Destination</label>
                    <input type="text" class="form-control" th:field="*{destination}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea class="form-control" th:field="*{description}" rows="3" required></textarea>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Start Date</label>
                    <input type="date" class="form-control" th:field="*{startDate}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">End Date</label>
                    <input type="date" class="form-control" th:field="*{endDate}" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Capacity</label>
                    <input type="number" class="form-control" th:field="*{capacity}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Available Slots</label>
                    <input type="number" class="form-control" th:field="*{availableSlots}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Price per Person (€)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{pricePerPerson}" required>
                </div>
            </div>

            <!-- 📸 Image Upload -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Upload Images</label>
                <input type="file" name="imageFiles" id="imageUpload" multiple class="form-control" accept="image/*">

                <div id="previewContainer" class="image-preview"></div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-4">💾 Save</button>
                <a href="/admin/packages" class="btn btn-secondary px-4 ms-2">↩ Back</a>
            </div>
        </form>
    </div>
</div>

<script>
    // 🖼 Preview uploaded images instantly
    document.getElementById('imageUpload').addEventListener('change', function (event) {
        const container = document.getElementById('previewContainer');
        container.innerHTML = '';
        for (let file of event.target.files) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                container.appendChild(img);
            };
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
