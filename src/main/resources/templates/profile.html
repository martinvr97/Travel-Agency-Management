<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .profile-card {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/dashboard">🌍 Travel Dashboard</a>
    <a class="btn btn-light" href="/logout">Logout</a>
  </div>
</nav>

<div class="profile-card">
  <h3 class="text-center text-primary mb-4 fw-bold">👤 My Profile</h3>

  <form th:action="@{/profile/update}" th:object="${user}" method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">First Name</label>
      <input type="text" class="form-control" th:field="*{firstName}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Last Name</label>
      <input type="text" class="form-control" th:field="*{lastName}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Email (read-only)</label>
      <input type="email" class="form-control" th:value="${user.email}" readonly>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Birthday</label>
      <input type="date" class="form-control" th:field="*{birthday}">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Nationality</label>
      <input type="text" class="form-control" th:field="*{nationality}">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Gender</label>
      <select class="form-select" th:field="*{gender}">
        <option value="">Select Gender</option>
        <option value="MALE">Male</option>
        <option value="FEMALE">Female</option>
      </select>
    </div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-primary">💾 Save Changes</button>

      <form th:action="@{/profile/delete}" method="post"
            onsubmit="return confirm('Are you sure you want to delete your account? This cannot be undone.')">
        <button type="submit" class="btn btn-danger">🗑️ Delete Account</button>
      </form>
    </div>

    <div th:if="${param.success}" class="alert alert-success mt-3 text-center">
      ✅ Profile updated successfully!
    </div>
  </form>
</div>
</body>
</html>
