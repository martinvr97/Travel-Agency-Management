<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <div class="card p-4 shadow">
        <h2 class="text-success mb-3">Payment Successful :tada:</h2>
        <p><strong>Package:</strong> <span th:text="${pkg.title}"></span></p>
        <p><strong>Number of People:</strong> <span th:text="${numPeople}"></span></p>
        <p><strong>Total Price:</strong> €<span th:text="${total}"></span></p>
        <p><strong>Payment Method:</strong> <span th:text="${method}"></span></p>
        <p class="fw-bold text-success" th:text="${status}"></p>
        <a href="/dashboard" class="btn btn-primary mt-3">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
