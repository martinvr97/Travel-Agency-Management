<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #E9F2FF 0%, #F8F9FA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .confirmation-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 550px;
            width: 100%;
            animation: fadeIn 0.7s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .confirmation-icon {
            font-size: 60px;
            color: #28A745;
            margin-bottom: 15px;
        }
        h2 {
            color: #198754;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .details p {
            font-size: 1.05rem;
            margin-bottom: 10px;
            color: #333;
        }
        .details strong {
            color: #0D6EFD;
        }
        .price {
            font-size: 1.2rem;
            color: #198754;
            font-weight: 600;
        }
        .btn-primary {
            background-color: #0D6EFD;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #0B5ED7;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="confirmation-card text-center">
    <i class="bi bi-check-circle-fill confirmation-icon"></i>
    <h2>Payment Successful :tada:</h2>
    <div class="details text-start">
        <p><strong>Package:</strong> <span th:text="${pkg.title}"></span></p>
        <p><strong>Destination:</strong> <span th:text="${pkg.destination}"></span></p>
        <p><strong>Number of People:</strong> <span th:text="${numPeople}"></span></p>
        <p><strong>Payment Method:</strong> <span th:text="${method}"></span></p>
        <p><strong>Total Paid:</strong> <span class="price">€<span th:text="${total}"></span></span></p>
        <p><strong>Status:</strong> <span class="text-success fw-bold" th:text="${status}"></span></p>
    </div>
    <a href="/dashboard" class="btn btn-primary mt-4">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
