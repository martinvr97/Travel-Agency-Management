<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        .star {
            color: gold;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">🌍 Travel Dashboard</a>
        <a class="btn btn-light" href="/logout">Logout</a>
    </div>
</nav>

<div class="container">
    <h2 class="text-center text-primary fw-bold mb-4">My Bookings</h2>

    <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info text-center">
        You haven't booked any trips yet.
    </div>

    <div class="row g-4">
        <div class="col-md-4 col-sm-6" th:each="booking : ${bookings}">
            <div class="card shadow-sm h-100 border-0">
                <img th:if="${booking.travelPackage.images != null and #lists.size(booking.travelPackage.images) > 0}"
                     th:src="@{${booking.travelPackage.images[0]}}"
                     class="card-img-top"
                     alt="Trip Image"
                     style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title fw-bold" th:text="${booking.travelPackage.title}"></h5>
                    <p><strong>Destination:</strong> <span th:text="${booking.travelPackage.destination}"></span></p>
                    <p><strong>Dates:</strong>
                        <span th:text="${booking.travelPackage.startDate}"></span> -
                        <span th:text="${booking.travelPackage.endDate}"></span>
                    </p>
                    <p><strong>Status:</strong> <span th:text="${booking.status}"></span></p>

                    <!-- 🔹 Show review section dynamically -->
                    <div th:if="${booking.travelPackage.endDate.isBefore(T(java.time.LocalDate).now())}">
                        <!-- If user has already left a review -->
                        <div th:if="${userReviews.containsKey(booking.travelPackage.id)}">
                            <hr>
                            <p class="fw-bold mb-1">Your Review:</p>
                            <p>
                                <span th:each="i : ${#numbers.sequence(1, userReviews[booking.travelPackage.id].rating)}"
                                      class="star">⭐</span>
                            </p>
                            <p th:text="${userReviews[booking.travelPackage.id].comment}" class="text-muted"></p>
                        </div>

                        <!-- If no review yet -->
                        <a th:if="${!userReviews.containsKey(booking.travelPackage.id)}"
                           th:href="@{'/reviews/add/' + ${booking.travelPackage.id}}"
                           class="btn btn-outline-success btn-sm">Leave Review</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
