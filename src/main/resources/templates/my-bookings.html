<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Travel Portal</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/bookings/my">My Bookings</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h2 class="text-center fw-bold text-primary mb-4">My Bookings</h2>
    <div th:if="${#lists.isEmpty(bookings)}" class="text-center text-muted">
        <p>You have no bookings yet. <a href="/dashboard" class="text-primary text-decoration-none">Browse packages</a>.</p>
    </div>
    <div th:unless="${#lists.isEmpty(bookings)}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Package</th>
                <th>Destination</th>
                <th>People</th>
                <th>Total Price (€)</th>
                <th>Status</th>
                <th>Booked On</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="booking, iterStat : ${bookings}">
                <td th:text="${iterStat.count}"></td>
                <td th:text="${booking.travelPackage.title}"></td>
                <td th:text="${booking.travelPackage.destination}"></td>
                <td th:text="${booking.numPeople}"></td>
                <td th:text="${booking.totalPrice}"></td>
                <td>
                    <span th:classappend="${booking.status.name() == 'CONFIRM'} ? 'status-success' : 'status-pending'"
                          th:text="${booking.status}"></span>
                </td>
                <td th:text="${#temporals.format(booking.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center mt-4">
        <a href="/dashboard" class="btn btn-back"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>
</body>
</html>
