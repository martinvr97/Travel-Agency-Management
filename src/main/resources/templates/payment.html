<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment - Confirm Booking</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F8F9FA;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
            width: 500px;
        }
        .card-header {
            background-color: #0D6EFD;
            color: white;
            font-weight: bold;
            font-size: 1.25rem;
        }
        .btn-success {
            background-color: #198754;
            border: none;
        }
        .btn-success:hover {
            background-color: #157347;
        }
        .price {
            font-size: 1.2rem;
            color: #198754;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header text-center">
        Confirm Your Booking
    </div>
    <div class="card-body">
        <!-- Travel Package Info -->
        <div class="mb-3 text-center">
            <h4 th:text="${pkg.title}">Package Title</h4>
            <p class="text-muted mb-1">
                <strong>Destination:</strong> <span th:text="${pkg.destination}"></span>
            </p>
            <p class="text-muted mb-1">
                <strong>Dates:</strong>
                <span th:text="${pkg.startDate}"></span> -
                <span th:text="${pkg.endDate}"></span>
            </p>
            <p class="price">€<span th:text="${pkg.pricePerPerson}"></span> per person</p>
        </div>
        <!-- Payment Form -->
        <form th:action="@{'/payments/confirm/' + ${pkg.id}}" method="post">
            <div class="mb-3">
                <label for="numPeople" class="form-label fw-bold">Number of People</label>
                <input type="number" id="numPeople" name="numPeople" class="form-control" min="1" required>
            </div>
            <div class="mb-3">
                <label for="method" class="form-label fw-bold">Payment Method</label>
                <select id="method" name="method" class="form-select" required>
                    <option value="">Select Payment Method</option>
                    <option value="CARD">:credit_card: Credit / Debit Card</option>
                    <option value="PAYPAL">:coin: PayPal</option>
                    <option value="BANK_TRANSFER">:bank: Bank Transfer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100 mt-3">Confirm Payment</button>
        </form>
        <div class="text-center mt-3">
            <a href="/dashboard" class="text-decoration-none text-primary">← Back to Dashboard</a>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
