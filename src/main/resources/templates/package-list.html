<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Packages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .table td, .table th {
            vertical-align: middle;
            text-align: center;
        }
        .card-img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
        }
        .booking-count {
            font-size: 1.1em;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="/dashboard">🌍 Admin Panel</a>
        <a class="btn btn-light" href="/logout">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary fw-bold">Manage Travel Packages</h2>
        <a href="/admin/packages/create" class="btn btn-success">➕ Add Package</a>
    </div>

    <form class="input-group mb-4" th:action="@{/admin/packages/search/destination}" method="get">
        <input type="text" name="destination" class="form-control" placeholder="Search by destination..." required>
        <button class="btn btn-primary" type="submit">Search</button>
    </form>

    <div th:if="${searchError != null}" class="alert alert-danger">
        <span th:text="${searchError}"></span>
    </div>

    <table class="table table-hover table-bordered bg-white shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Title</th>
            <th>Destination</th>
            <th>Price (€)</th>
            <th>Available Slots</th>
            <th>Booked Users</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="pkg : ${packageList != null ? packageList : packages}">
            <td th:text="${pkg.id}"></td>

            <td>
                <img th:src="@{${pkg.images != null && pkg.images.size() > 0 ? pkg.images[0] : '/img/default.jpg'}}"
                     alt="Travel Image" class="card-img">
            </td>

            <td th:text="${pkg.title}"></td>
            <td th:text="${pkg.destination}"></td>
            <td class="text-success fw-semibold" th:text="'€' + ${pkg.pricePerPerson}"></td>
            <td th:text="${pkg.availableSlots}"></td>

            <td class="booking-count" th:text="${bookingCounts != null ? bookingCounts.get(pkg.id) : 0}"></td>

            <td>
                <a th:href="@{'/admin/packages/edit/' + ${pkg.id}}" class="btn btn-sm btn-warning me-1">✏️ Edit</a>
                <a th:href="@{'/admin/packages/delete/' + ${pkg.id}}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this package?')">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
