<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Packages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">🌍 Admin Panel</a>
        <a class="btn btn-light" href="/logout">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary fw-bold">Manage Travel Packages</h2>
        <a href="/admin/packages/create" class="btn btn-success">➕ Add Package</a>
    </div>

    <table class="table table-hover table-bordered bg-white shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Destination</th>
            <th>Price (€)</th>
            <th>Available Slots</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pkg : ${packages}">
            <td th:text="${pkg.id}"></td>
            <td th:text="${pkg.title}"></td>
            <td th:text="${pkg.destination}"></td>
            <td th:text="${pkg.pricePerPerson}"></td>
            <td th:text="${pkg.availableSlots}"></td>
            <td>
                <a th:href="@{'/admin/packages/edit/' + ${pkg.id}}" class="btn btn-sm btn-warning">✏️ Edit</a>
                <a th:href="@{'/admin/packages/delete/' + ${pkg.id}}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this package?')">🗑️ Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
