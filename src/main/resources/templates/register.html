<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <h3 class="text-center mb-4 fw-bold">Create an Account</h3>
                <form th:action="@{/register}" th:object="${user}" method="post">
                    <div class="mb-3">
                        <input type="text" class="form-control" th:field="*{firstName}" placeholder="First Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" th:field="*{lastName}" placeholder="Last Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" th:field="*{email}" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" th:field="*{password}" placeholder="Password" required>
                    </div>
                    <div class="mb-3">
                        <input type="date" class="form-control" th:field="*{birthday}" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" th:field="*{nationality}" placeholder="Nationality" required>
                    </div>
                    <div class="mb-3">
                        <select class="form-select" th:field="*{gender}" required>
                            <option value="">Select Gender</option>
                            <option value="FEMALE">Female</option>
                            <option value="MALE">Male</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="login-link">Already have an account? Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
