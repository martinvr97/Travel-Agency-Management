<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register</title></head>
<body>
 <h2>Register</h2>
 <form th:action="@{/register}" th:object="${user}" method="post">
     <input type="text" th:field="*{firstName}" placeholder="First Name" required>
     <input type="text" th:field="*{lastName}" placeholder="Last Name" required>
     <input type="email" th:field="*{email}" placeholder="Email" required>
     <input type="password" th:field="*{password}" placeholder="Password" required>
     <input type="date" th:field="*{birthday}" placeholder="Birthday" required>
     <input type="text" th:field="*{nationality}" placeholder="Nationality" required>
     <select th:field="*{gender}" required>
         <option value="FEMALE">Female</option>
         <option value="MALE">Male</option>
     </select>
     <button type="submit">Register</button>
 </form>
 <a th:href="@{/login}">Already have an account? Login</a>
</body>
</html>
