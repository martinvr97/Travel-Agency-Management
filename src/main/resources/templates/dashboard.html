<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Travel Packages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Travel Dashboard</a>
        <li class="nav-item">
            <a class="nav-link" href="/bookings/my">My Bookings</a>
        </li>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container py-5">
    <h2 class="mb-4 text-center fw-bold text-primary">Available Travel Packages</h2>
    <div class="row g-4">
        <div class="col-md-4" th:each="pkg : ${packages}">
            <div class="card package-card h-100 shadow-sm border-0">
                <img th:if="${pkg.images != null}" th:src="${pkg.images[0]}" alt="Travel Image" class="package-img card-img-top">
                <div class="card-body">
                    <h5 class="card-title" th:text="${pkg.title}">Package Title</h5>
                    <p class="card-text mb-1"><strong>Destination:</strong> <span th:text="${pkg.destination}"></span></p>
                    <p class="card-text mb-1">
                        <strong>Dates:</strong>
                        <span th:text="${pkg.startDate}"></span> -
                        <span th:text="${pkg.endDate}"></span>
                    </p>
                    <p class="card-text mb-1"><strong>Available Slots:</strong> <span th:text="${pkg.availableSlots}"></span></p>
                    <p class="card-text mb-1"><strong>Rating:</strong> :star: <span th:text="${pkg.averageRating}"></span>/5</p>
                </div>
                <div class="card-footer bg-white border-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="price">€<span th:text="${pkg.pricePerPerson}"></span></span>
                        <form th:action="@{'/payments/' + ${pkg.id}}" method="get">
                            <button type="submit" class="btn btn-sm btn-primary">Book Now</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
