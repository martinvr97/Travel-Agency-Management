<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leave a Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center text-primary mb-4">Leave a Review for <span th:text="${pkg.title}"></span></h2>

        <form th:action="@{'/reviews/add/' + ${pkg.id}}" th:object="${review}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Rating (1-5)</label>
                <input type="number" min="1" max="5" class="form-control" th:field="*{rating}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Comment</label>
                <textarea class="form-control" th:field="*{comment}" rows="3"></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success px-4">Submit Review</button>
                <a href="/dashboard" class="btn btn-secondary px-4 ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
